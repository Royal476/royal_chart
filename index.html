<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
body{margin:0;background:#000}
#top{height:32px;background:#111;color:#aaa;display:flex;justify-content:space-between;align-items:center;padding:0 12px;font:12px sans-serif}
#chart{width:100vw;height:calc(100vh - 32px)}
</style>
</head>
<body>
<div id="top"><span id="sym">Loading...</span><span id="price">...</span></div>
<div id="chart"></div>
<script>
const API_KEY = '4fdf19aaad944ac595534fbd8afca6c3';

let url = new URLSearchParams(location.search);
let raw = (url.get('symbol')||'XAUUSD').toUpperCase().replace('/','');
let tf = url.get('tf')||'15m';
document.getElementById('sym').innerText = raw+' / '+tf;

let chart = LightweightCharts.createChart(document.getElementById('chart'),{
  layout:{background:{color:'#000'},textColor:'#DDD'},
  grid:{vertLines:{color:'#222'},horzLines:{color:'#222'}},
});
let series = chart.addCandlestickSeries({upColor:'#00ff88',downColor:'#ff4444',borderVisible:false});

async function load(){
  try{
    if(API_KEY.includes('PASTE_YOUR')){ document.getElementById('price').innerText='PUT YOUR API KEY INSIDE CODE'; return; }

    // Convert EURUSD -> EUR/USD, XAUUSD -> XAU/USD, BTCUSD -> BTC/USD
    let symbol = raw.slice(0,3)+'/'+raw.slice(3);
    if(raw.startsWith('XAU')) symbol='XAU/USD';
    if(raw.startsWith('XAG')) symbol='XAG/USD';

    let tfMap={'1m':'1min','5m':'5min','15m':'15min','30m':'30min','1h':'1h','4h':'4h','1d':'1day'};
    let interval = tfMap[tf]||'15min';

    document.getElementById('price').innerText = 'Fetching '+symbol+' '+interval+'...';

    let apiUrl = `https://api.twelvedata.com/time_series?symbol=${symbol}&interval=${interval}&apikey=${API_KEY}&outputsize=200`;
    let res = await fetch(apiUrl);
    let json = await res.json();

    if(json.code==429){ document.getElementById('price').innerText='TwelveData Limit Reached - Wait 1 min'; return; }
    if(!json.values){ document.getElementById('price').innerText='Error: '+(json.message||'No data'); console.log(json); return; }

    let data = json.values.reverse().map(v=>({
      time: new Date(v.datetime).getTime()/1000,
      open: parseFloat(v.open),
      high: parseFloat(v.high),
      low: parseFloat(v.low),
      close: parseFloat(v.close)
    }));

    series.setData(data);
    chart.timeScale().fitContent();
    document.getElementById('price').innerText = data[data.length-1].close.toFixed(2)+' LIVE '+symbol;
    window.lastData = data;

  }catch(e){
    document.getElementById('price').innerText = 'Network Error: '+e;
  }
}
load();
setInterval(load, 15000);

// For Roya Bot SCAN button - OFFICIAL screenshot - NO BLACK SCREEN
window.getChartScreenshot = async () => {
  let canvas = await chart.takeScreenshot();
  return canvas.toDataURL('image/png');
};
window.getCandleData = () => {
  return JSON.stringify({symbol: raw, tf: tf, candles: window.lastData||[]});
};
</script>
</body>
</html>
